<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Illustration of a calm, empty med spa treatment room with a laser device beside the treatment bed</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ece1"/>
      <stop offset="1" stop-color="#ecdfcf"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2d0bb"/>
      <stop offset="1" stop-color="#d6c0a7"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f6ede2"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf3" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fffaf3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece4d9"/>
    </linearGradient>
    <linearGradient id="bedTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7f1"/>
      <stop offset="1" stop-color="#efe5d8"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c98a6e"/>
      <stop offset="1" stop-color="#a8624a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6ea" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff6ea" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- room -->
  <rect width="800" height="1000" fill="url(#wall)"/>
  <rect y="720" width="800" height="280" fill="url(#floor)"/>
  <rect y="716" width="800" height="8" fill="#e6d7c4"/>

  <!-- arched window -->
  <g>
    <path d="M300 690 V300 a150 150 0 0 1 300 0 V690 Z" fill="#e7dac9"/>
    <path d="M316 690 V304 a134 134 0 0 1 268 0 V690 Z" fill="url(#window)"/>
    <circle cx="450" cy="330" r="160" fill="url(#glow)"/>
    <path d="M450 172 V690 M316 450 H584" stroke="#e7dac9" stroke-width="6"/>
    <path d="M300 690 H600 V706 H300 Z" fill="#e2d3c0"/>
    <!-- sheer curtain -->
    <rect x="270" y="138" width="420" height="6" rx="3" fill="#d9c5ad"/>
    <path d="M592 144 H690 V712 C 672 716, 640 714, 606 712 C 616 560, 620 380, 592 144 Z" fill="#fbf6ef" opacity=".92"/>
    <path d="M620 150 C 636 340, 632 540, 630 712 M650 150 C 660 360, 662 540, 662 712" stroke="#ece0d0" stroke-width="3" fill="none"/>
  </g>

  <!-- sunlight on floor -->
  <path d="M316 700 L584 700 L700 1000 L360 1000 Z" fill="url(#beam)" opacity=".7"/>

  <!-- pendant lamp -->
  <line x1="190" y1="0" x2="190" y2="170" stroke="#b9a58e" stroke-width="2"/>
  <circle cx="190" cy="196" r="30" fill="#fffaf2"/>
  <circle cx="190" cy="196" r="70" fill="url(#glow)" opacity=".8"/>

  <!-- wall shelf with vase -->
  <rect x="96" y="330" width="150" height="10" rx="3" fill="#d9c5ad"/>
  <path d="M128 330 c-6 -30 2 -52 14 -60 c12 8 20 30 14 60 Z" fill="#e9c7b7"/>
  <path d="M142 272 c-4 -26 4 -48 18 -64 M142 272 c6 -20 -2 -40 -16 -52" stroke="#a49e83" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="190" y="306" width="40" height="24" rx="3" fill="#f7f1e8"/>
  <rect x="194" y="296" width="32" height="12" rx="3" fill="#efe3d4"/>

  <!-- floor shadow under bed -->
  <ellipse cx="300" cy="880" rx="250" ry="26" fill="#b99c7e" opacity=".35" filter="url(#soft)"/>

  <!-- treatment bed -->
  <g>
    <rect x="120" y="790" width="22" height="80" rx="6" fill="#cdb497"/>
    <rect x="440" y="790" width="22" height="80" rx="6" fill="#cdb497"/>
    <rect x="96" y="760" width="400" height="44" rx="14" fill="#d9c3a8"/>
    <path d="M96 760 H496 a14 14 0 0 1 14 14 v0 H82 v0 a14 14 0 0 1 14 -14 Z" fill="#cfb699"/>
    <rect x="82" y="716" width="428" height="56" rx="24" fill="url(#bedTop)"/>
    <!-- raised head section -->
    <path d="M100 730 C 96 690, 112 652, 150 640 L 214 628 C 222 660, 226 700, 226 730 Z" fill="#f7f0e6"/>
    <path d="M150 640 L 214 628 C 222 660, 226 700, 226 730" stroke="#e8dccb" stroke-width="3" fill="none"/>
    <!-- folded towels -->
    <rect x="370" y="694" width="110" height="26" rx="10" fill="#e9c7b7"/>
    <rect x="378" y="676" width="94" height="22" rx="9" fill="#f3dfd4"/>
    <path d="M378 687 h94" stroke="#e5c8b8" stroke-width="2"/>
  </g>

  <!-- laser device -->
  <ellipse cx="640" cy="900" rx="110" ry="18" fill="#b99c7e" opacity=".35" filter="url(#soft)"/>
  <g>
    <!-- base + wheels -->
    <rect x="566" y="852" width="150" height="26" rx="10" fill="#e4dacd"/>
    <circle cx="584" cy="886" r="10" fill="#6f625a"/>
    <circle cx="698" cy="886" r="10" fill="#6f625a"/>
    <!-- body -->
    <path d="M580 860 L596 560 a20 20 0 0 1 20 -18 H676 a20 20 0 0 1 20 18 L706 860 Z" fill="url(#device)"/>
    <path d="M596 640 H698" stroke="#e7ddd0" stroke-width="3"/>
    <rect x="610" y="700" width="72" height="8" rx="4" fill="#efe6da"/>
    <rect x="610" y="720" width="72" height="8" rx="4" fill="#efe6da"/>
    <circle cx="646" cy="800" r="7" fill="#c17b5e"/>
    <!-- screen arm -->
    <rect x="640" y="500" width="12" height="46" rx="5" fill="#ddd2c4"/>
    <g transform="rotate(-8 646 470)">
      <rect x="586" y="430" width="124" height="84" rx="12" fill="#f8f4ee"/>
      <rect x="596" y="440" width="104" height="64" rx="7" fill="#3d332e"/>
      <path d="M606 488 C 622 470, 636 486, 650 468 S 680 470, 690 456" stroke="#e9c7b7" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="606" y="450" width="34" height="5" rx="2.5" fill="#c17b5e"/>
    </g>
    <!-- handpiece holder + cable -->
    <rect x="696" y="600" width="24" height="44" rx="8" fill="#ece3d7"/>
    <path d="M706 604 L 714 560 a8 8 0 0 1 16 2 L 724 606 Z" fill="#fdfbf8"/>
    <rect x="712" y="546" width="20" height="18" rx="6" fill="#3d332e" transform="rotate(10 722 555)"/>
    <path d="M708 640 C 760 700, 760 800, 716 850" stroke="#cfc3b4" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- plant -->
  <ellipse cx="80" cy="930" rx="70" ry="12" fill="#b99c7e" opacity=".35" filter="url(#softer)"/>
  <g>
    <path d="M30 830 h100 l-12 100 h-76 Z" fill="url(#pot)"/>
    <rect x="26" y="824" width="108" height="14" rx="5" fill="#c98a6e"/>
    <g fill="#a3a483">
      <path d="M80 826 C 40 760, 10 700, 18 620 C 52 670, 74 740, 80 826 Z"/>
      <path d="M80 826 C 96 740, 120 680, 160 640 C 160 720, 120 780, 80 826 Z" fill="#b5b597"/>
      <path d="M80 826 C 70 730, 80 640, 110 560 C 126 650, 104 740, 80 826 Z" fill="#8f9172"/>
      <path d="M80 826 C 50 780, 30 760, -10 740 C 20 800, 54 820, 80 826 Z" fill="#b5b597"/>
    </g>
  </g>

  <!-- small stool -->
  <g>
    <ellipse cx="520" cy="912" rx="40" ry="8" fill="#b99c7e" opacity=".3" filter="url(#softer)"/>
    <rect x="490" y="852" width="60" height="16" rx="8" fill="#e9c7b7"/>
    <rect x="516" y="866" width="8" height="40" fill="#cdb497"/>
    <rect x="496" y="902" width="48" height="6" rx="3" fill="#cdb497"/>
  </g>
</svg>
